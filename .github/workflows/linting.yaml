---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  linting:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/linting@92f5b02366f48f287deea60661b0bdb1cec1a427 # v0
        with:
          pre-commit-config: ./.pre-commit-config.yaml
