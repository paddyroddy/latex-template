---
name: Deploy

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  chktex:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/latex/chktex@626ab242bf611add6f1b7af17aa24f8bf12c5521 # v0

  vale:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/vale@626ab242bf611add6f1b7af17aa24f8bf12c5521 # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  compile-latex:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/latex/compile@626ab242bf611add6f1b7af17aa24f8bf12c5521 # v0

      - name: Upload artefacts
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artefacts
          path: "*.pdf"
          if-no-files-found: error

  upload-to-dropbox:
    if: github.ref == 'refs/heads/main'
    needs: compile-latex
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - name: Download artefacts
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artefacts

      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/dropbox@626ab242bf611add6f1b7af17aa24f8bf12c5521 # v0
        env:
          CONFIGFILE_VERSION: ${{ secrets.CONFIGFILE_VERSION }}
          OAUTH_APP_KEY: ${{ secrets.OAUTH_APP_KEY }}
          OAUTH_APP_SECRET: ${{ secrets.OAUTH_APP_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        with:
          configfile-version: ${{ env.CONFIGFILE_VERSION }}
          files-to-upload: $(find . -maxdepth 1 -name '*.pdf' -print)
          oauth-app-key: ${{ env.OAUTH_APP_KEY }}
          oauth-app-secret: ${{ env.OAUTH_APP_SECRET }}
          oauth-refresh-token: ${{ env.OAUTH_REFRESH_TOKEN }}
